# FastSpeech 2 - Telugu (IndicTTS Telugu). One file = upstream preprocess.yaml + model.yaml + train.yaml.
language: te

preprocess:
  dataset: "IndicTTS_Telugu"
  source:
    source: hf
    name: "SPRINGLab/IndicTTS_Telugu"   # IIT Madras IndicTTS Telugu (parquet on HuggingFace)
    split: train
    # audio/text columns are auto-detected; "gender" (if present) is used as the speaker label
    speaker_keys: [gender]
  selection:
    speaker_mode: single_best           # one speaker -> cleaner model than mixing both voices
    train_hours: 5.0
    val_hours: 1.0
    oversample: 1.10
    min_duration: 1.0
    max_duration: 15.0
    dedupe_transcripts: true
    seed: 1234
  path:
    raw_path: "raw_data/IndicTTS_Telugu"
    preprocessed_path: "preprocessed_data/IndicTTS_Telugu"
    lexicon_path: "preprocessed_data/IndicTTS_Telugu/lexicon.txt"
  preprocessing:
    text:
      text_cleaners: ["telugu_cleaners"]
      language: "te"
    audio:
      sampling_rate: 22050
      max_wav_value: 32768.0
    stft:
      filter_length: 1024
      hop_length: 256
      win_length: 1024
    mel:
      n_mel_channels: 80
      mel_fmin: 0
      mel_fmax: 8000        # HiFi-GAN (universal) expects 8 kHz
    pitch:
      feature: "phoneme_level"
      normalization: True
    energy:
      feature: "phoneme_level"
      normalization: True

model:
  transformer:
    encoder_layer: 4
    encoder_head: 2
    encoder_hidden: 256
    decoder_layer: 6
    decoder_head: 2
    decoder_hidden: 256
    conv_filter_size: 1024
    conv_kernel_size: [9, 1]
    encoder_dropout: 0.2
    decoder_dropout: 0.2
  variance_predictor:
    filter_size: 256
    kernel_size: 3
    dropout: 0.5
  variance_embedding:
    pitch_quantization: "linear"
    energy_quantization: "linear"
    n_bins: 256
  multi_speaker: False
  max_seq_len: 1500          # frames (17 s at hop 256 / 22.05 kHz); upstream default is 1000
  vocoder:
    model: "HiFi-GAN"
    speaker: "universal"     # bundled generator_universal checkpoint (common/hifigan/)

train:
  path:
    ckpt_path: "checkpoints"
    log_path: "logs"
    result_path: "logs/result"
  num_workers: 2
  optimizer:
    batch_size: 16
    betas: [0.9, 0.98]
    eps: 0.000000001
    weight_decay: 0.0
    grad_clip_thresh: 1.0
    grad_acc_step: 1
    warm_up_step: 4000
    anneal_steps: [40000, 50000, 55000]
    anneal_rate: 0.3
  step:
    total_step: 60000
    log_step: 50
    synth_step: 2000
    val_step: 1000
    save_step: 5000

inference:
  speaker: auto
